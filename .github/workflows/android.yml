name: Android CI - Android 7+ Support

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [24, 26, 33]  # Test Android 7.0, 8.0, and 13

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create local.properties
      run: |
        echo "GITHUB_CLIENT_ID=" >> local.properties
        echo "GITHUB_CLIENT_SECRET=" >> local.properties

    - name: Run Lint
      run: ./gradlew lintDebug --stacktrace

    - name: Build with Gradle
      run: ./gradlew build --stacktrace

    - name: Run Unit Tests
      run: ./gradlew test --stacktrace

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-api${{ matrix.api-level }}
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Lint Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lint-reports-api${{ matrix.api-level }}
        path: app/build/reports/lint-results-debug.html

  build-release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create local.properties
      run: |
        echo "GITHUB_CLIENT_ID=" >> local.properties
        echo "GITHUB_CLIENT_SECRET=" >> local.properties

    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-android7-support
        path: app/build/outputs/apk/release/app-release.apk

  nightly-release:
    runs-on: ubuntu-latest
    needs: [build, build-release]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create local.properties
      run: |
        echo "GITHUB_CLIENT_ID=" >> local.properties
        echo "GITHUB_CLIENT_SECRET=" >> local.properties

    - name: Build Nightly APKs
      run: |
        ./gradlew assembleDebug assembleRelease --stacktrace

    - name: Get current date and commit
      id: date
      run: |
        echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
        echo "datetime=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
        echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

    - name: Create/Update Nightly Tag
      run: |
        BRANCH_NAME="${{ steps.date.outputs.branch }}"
        TAG_NAME="nightly-${BRANCH_NAME}-${{ steps.date.outputs.date }}"
        
        # Delete existing nightly tag if it exists
        git tag -d "${TAG_NAME}" 2>/dev/null || true
        git push origin ":refs/tags/${TAG_NAME}" 2>/dev/null || true
        
        # Create new tag
        git tag "${TAG_NAME}"
        git push origin "${TAG_NAME}"
        
        echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

    - name: Create Nightly Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: "Nightly Build - ${{ steps.date.outputs.branch }} (${{ steps.date.outputs.date }})"
        body: |
          ## 🌙 Nightly Build - Android 7+ Support
          
          **Build Information:**
          - **Branch:** ${{ steps.date.outputs.branch }}
          - **Date:** ${{ steps.date.outputs.datetime }}
          - **Commit:** ${{ steps.date.outputs.commit }}
          - **Android Support:** 7.0+ (API 24+)
          
          **📱 APK Files:**
          - `app-debug.apk` - Debug build for testing
          - `app-release.apk` - Release build for production
          
          **⚠️ Note:** This is a nightly development build. Use release builds for production.
          
          **🔄 Changes since last nightly:**
          ${{ github.event.head_commit.message }}
        draft: false
        prerelease: true
        files: |
          app/build/outputs/apk/debug/app-debug.apk
          app/build/outputs/apk/release/app-release.apk
        token: ${{ secrets.GITHUB_TOKEN }}

  security-scan:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Run Security Scan
      run: |
        ./gradlew assembleDebug
        echo "Security scan would run here"
        # Add specific security scanning tools as needed